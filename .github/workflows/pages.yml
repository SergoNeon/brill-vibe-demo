name: Publish BRILL VIBE interactive preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript and locale packs
        run: |
          node --check app.js
          node --check language-packs.js
          node --check vibe-locales.js
          node --check vibe-app.js
          node --check vibe-portraits.js
          grep -q 'id="view-home"' index.html
          grep -q 'id="view-chats"' index.html
          grep -q 'vibe-app.js' index.html
          node -e 'const fs=require("node:fs");const vm=require("node:vm");const win={};vm.runInNewContext(fs.readFileSync("language-packs.js","utf8"),{window:win});const m=win.BRILL_I18N;if(!m||Object.values(m.packs).some(p=>Object.keys(p).length!==m.keys.length))process.exit(1);console.log(Object.keys(m.packs).length+" new complete language packs, "+m.codes.length+" locale options");'
          grep -q 'id="languageDialog"' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
